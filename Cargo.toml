[workspace]

resolver = "3"

members = [
    "crates/main/cgp-fork",
    "crates/macros/cgp-fork-macro",
    "crates/macros/cgp-fork-macro-impl",
    "crates/tests/doctests",
]

[workspace.package]
version         = "0.10.1"
rust-version    = "1.89"
edition         = "2024"
license         = "Apache-2.0"
repository      = "https://github.com/Just-Replicant/cgp-fork"
authors         = ["Just Replicant <Just-Replicant@users.noreply.github.com>"]
homepage        = "https://github.com/Just-Replicant/cgp-fork"
keywords        = ["cgp-fork", "traits", "dsl", "dependency-injection", "macros"]
categories      = ["rust-patterns", "no-std"]

[workspace.dependencies]
cgp-fork       = { version = "0.10.1", path = "./crates/main/cgp-fork" }
cgp-fork-macro = { version = "0.10.1", path = "./crates/macros/cgp-fork-macro" }
cgp-fork-macro-impl = { version = "0.10.1", path = "./crates/macros/cgp-fork-macro-impl" }

# A curated subset of `clippy::pedantic`, enforced by CI's `-D warnings`.
[workspace.lints.clippy]
explicit_iter_loop                  = "warn"
match_wildcard_for_single_variants  = "warn"
ref_option                          = "warn"
semicolon_if_nothing_returned       = "warn"
uninlined_format_args               = "warn"
