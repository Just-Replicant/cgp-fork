name: Tests

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    # Weekly, so a new RustSec advisory or a toolchain change surfaces without a push.
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Pinned tool versions. Binaries are either checksum-verified downloads or
  # `cargo install --locked` builds from crates.io (crates.io verifies the
  # package checksum and `--locked` pins the tool's dependency graph).
  NEXTEST_VERSION: "0.9.150"
  NEXTEST_SHA256: "b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f"
  CARGO_HACK_VERSION: "0.6.45"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_SEMVER_CHECKS_VERSION: "0.51.0"
  CARGO_LLVM_COV_VERSION: "0.9.1"
  CARGO_FUZZ_VERSION: "0.13.2"
  MSRV: "1.89"

# Cancel in-progress runs when a new commit is pushed to the same PR, branch, or tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# To minimize supply-chain exposure this workflow uses only GitHub's own
# first-party actions (checkout, cache, upload-artifact), each pinned to a full
# commit SHA; Dependabot proposes updates. Every toolchain and tool is installed
# with the rustup/cargo already present on the runner.
jobs:
  fmt:
    name: Rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: cargo +nightly fmt --all -- --check
      # `fuzz/` is outside the workspace, so `--all` does not reach it.
      - run: cargo +nightly fmt --manifest-path fuzz/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings

  test:
    name: Test (nextest, ${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ["--all-features", "--no-default-features"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: test-${{ runner.os }}-${{ matrix.features }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install cargo-nextest (pinned, checksum-verified)
        run: |
          tmpdir=$(mktemp -d)
          curl -fsSL -o "$tmpdir/nextest.tar.gz" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NEXTEST_SHA256}  $tmpdir/nextest.tar.gz" | sha256sum -c -
          tar -xzf "$tmpdir/nextest.tar.gz" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version
      # Runs the whole workspace, including the trybuild `ui` target (all features only).
      # Post-codegen compile failures live in cargo-cgp.
      - name: Run tests
        run: cargo nextest run --workspace ${{ matrix.features }} --no-fail-fast
      # nextest does not run doctests.
      - name: Run doctests
        run: cargo test --workspace ${{ matrix.features }} --doc
      - name: Build examples
        if: matrix.features == '--all-features'
        run: cargo build -p cgp-fork --all-features --examples

  test-os:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Run tests
        run: cargo test --workspace --all-features --no-fail-fast

  # Early warning for the next toolchain bump: runs clippy and the tests on the
  # newest stable and on beta instead of the pinned `rust-toolchain.toml`. A
  # failure here is a heads-up (usually a changed diagnostic in a `tests/ui`
  # `.stderr` snapshot or a new lint), not a broken `main`, so it never fails
  # the workflow. Leave it out of the required checks.
  canary:
    name: Toolchain canary (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ${{ matrix.toolchain }}
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy
      - name: Clippy
        run: cargo +${{ matrix.toolchain }} clippy --workspace --all-features --all-targets -- -D warnings
      - name: Tests
        run: cargo +${{ matrix.toolchain }} test --workspace --all-features --no-fail-fast

  docs:
    name: Rustdoc (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Build docs as docs.rs does
        env:
          RUSTDOCFLAGS: "-D warnings --cfg docsrs"
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the MSRV toolchain
        run: rustup toolchain install "$MSRV" --profile minimal
      # `+toolchain` overrides rust-toolchain.toml. The lockfile is resolved
      # MSRV-aware (resolver 3), so the locked versions build on the MSRV.
      - name: Check every target and feature on the MSRV
        run: cargo +"$MSRV" check --workspace --all-features --all-targets --locked
      - name: Check without default features on the MSRV
        run: cargo +"$MSRV" check --workspace --no-default-features --locked

  no-std:
    name: no_std target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Add a bare-metal target
        run: rustup target add thumbv7m-none-eabi
      # The facade is advertised as no_std. A dependency that omits `#![no_std]`
      # still links `std` and fails this check for every bare-metal target.
      - name: Check the facade without std (default features)
        run: cargo check -p cgp-fork --target thumbv7m-none-eabi
      - name: Check the facade with only core
        run: cargo check -p cgp-fork --target thumbv7m-none-eabi --no-default-features

  features:
    name: Feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup target add thumbv7m-none-eabi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-hack
          key: cargo-hack-${{ runner.os }}-${{ env.CARGO_HACK_VERSION }}
      - name: Install cargo-hack
        run: command -v cargo-hack || cargo install --locked "cargo-hack@${CARGO_HACK_VERSION}"
      - name: Every feature combination (host)
        run: cargo hack check -p cgp-fork --feature-powerset --no-dev-deps
      - name: Every feature combination (no_std; eyre needs std)
        run: cargo hack check -p cgp-fork --feature-powerset --no-dev-deps --exclude-features eyre --target thumbv7m-none-eabi

  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}
      - name: Install cargo-deny
        run: command -v cargo-deny || cargo install --locked "cargo-deny@${CARGO_DENY_VERSION}"
      - run: cargo deny check

  audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install --locked "cargo-audit@${CARGO_AUDIT_VERSION}"
      - run: cargo audit --deny warnings

  semver:
    name: Semver (cargo-semver-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          key: cargo-semver-checks-${{ runner.os }}-${{ env.CARGO_SEMVER_CHECKS_VERSION }}
      - name: Install cargo-semver-checks
        run: command -v cargo-semver-checks || cargo install --locked "cargo-semver-checks@${CARGO_SEMVER_CHECKS_VERSION}"
      # Compares the facade's public API with the latest release on crates.io and
      # fails when the change needs a larger version bump than Cargo.toml has.
      - run: cargo semver-checks -p cgp-fork

  package:
    name: Package (publish dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Packages and verifies both crates together, so the facade builds against
      # the macro crate being released rather than the one on crates.io.
      - name: Package the workspace
        run: cargo package --workspace --exclude cgp-fork-doctests --exclude cgp-fork-renamed-dep --exclude cgp-fork-preset-consumer --locked
      - name: No tests or build script in the facade package
        run: |
          if cargo package -p cgp-fork --list --allow-dirty | grep -E '^(tests/|build\.rs$)'; then
            echo "unexpected files in the cgp-fork package" >&2
            exit 1
          fi
      # Unpacks both `.crate` files and runs `cargo test` from them, so a test
      # module that points at an excluded file, or a missing LICENSE, fails here
      # rather than for whoever builds the published sources.
      - name: Test the packaged crates
        run: bash scripts/test-packages.sh

  coverage:
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup component add llvm-tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Install cargo-llvm-cov
        run: command -v cargo-llvm-cov || cargo install --locked "cargo-llvm-cov@${CARGO_LLVM_COV_VERSION}"
      - name: Measure coverage
        shell: bash
        run: |
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
      # Line-coverage floor. Measured at 94.6% when the gate was added (0.10.1);
      # the floor sits below that so ordinary churn does not trip it, but a change
      # that drops a whole area's tests does. Raise it as coverage grows.
      - name: Enforce the coverage floor
        run: cargo llvm-cov report --summary-only --fail-under-lines 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt

  fuzz:
    name: Macro fuzzing (deep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      # A fresh seed per run explores new inputs; it is printed so a failure reproduces.
      - name: Fuzz every macro entrypoint
        run: |
          seed=${{ github.run_id }}
          echo "CGP_FUZZ_SEED=$seed"
          CGP_FUZZ_ITERS=20000 CGP_FUZZ_SEED=$seed cargo test --release -p cgp-fork-macro-impl robustness
      # The cargo-fuzz crate links cgp-fork-macro-impl; check that it
      # still builds (on the pinned stable toolchain) so a refactor cannot
      # silently break the scheduled coverage-guided run below.
      - name: Check the cargo-fuzz crate builds
        run: cargo clippy --manifest-path fuzz/Cargo.toml --locked --bins --examples -- -D warnings

  # Coverage-guided fuzzing with libFuzzer. It needs nightly and runs for 30
  # minutes, so only on the weekly schedule and on demand, never on a PR.
  # Non-blocking: a finding uploads the crashing input as an artifact; turn it
  # into a `macro_tests` regression test, then fix it.
  cargo-fuzz:
    name: Coverage-guided fuzzing (cargo-fuzz)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install --locked "cargo-fuzz@${CARGO_FUZZ_VERSION}"
      - name: Write the seed corpus
        run: cargo +nightly run --manifest-path fuzz/Cargo.toml --locked --example write_seeds -- fuzz/corpus
      - name: Fuzz every macro entrypoint for 15 minutes
        run: cargo +nightly fuzz run entrypoints -- -max_total_time=900 -rss_limit_mb=4096
      # One target per entrypoint (see fuzz/README.md), 20 seconds each.
      - name: Fuzz each entrypoint on its own
        shell: bash
        run: |
          for target in $(cargo +nightly fuzz list); do
            [ "$target" = entrypoints ] && continue
            cargo +nightly fuzz run "$target" -- -max_total_time=20 -rss_limit_mb=4096
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cargo-fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Every `cgp-knowledge-base-fork/<path>` reference in comments and docs must
  # name a page of the public knowledge base, or a draft in `docs/kb-pages/`
  # waiting to be copied there. Non-blocking: the knowledge base is a separate
  # repository that moves on its own.
  kb-refs:
    name: Knowledge-base references
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the public knowledge base
        run: git clone --depth 1 https://github.com/Just-Replicant/cgp-knowledge-base-fork "$RUNNER_TEMP/kb"
      - name: Check references
        run: bash scripts/check-kb-refs.sh "$RUNNER_TEMP/kb"

  compile-time:
    name: Compile-time budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      # `bash` so the job does not depend on the executable bit. Windows checkouts
      # with `core.filemode=true` drop it, and committing that mode change would
      # make `./scripts/compile-time.sh` fail here.
      #
      # `shell: bash` adds `-o pipefail`; without it the `| tee` hid an over-budget
      # exit and the budget never failed the job.
      - name: Time a 200-component wiring
        shell: bash
        run: RESULT_FILE=compile-time-secs.txt bash scripts/compile-time.sh | tee compile-time.txt
      # The trend series lives in the Actions cache: each push to `main` saves a
      # new entry under a unique key, and every run restores the newest one by
      # prefix. Pull requests read `main`'s series but never write it.
      - name: Restore the compile-time history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: compile-time-history.jsonl
          key: compile-time-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: compile-time-history-${{ runner.os }}-
      - name: Compare with the rolling median
        shell: bash
        env:
          RECORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          args=(--history compile-time-history.jsonl --value "$(cat compile-time-secs.txt)")
          if [[ "$RECORD" == "true" ]]; then
            args+=(--record --sha "$GITHUB_SHA")
          fi
          python3 scripts/compile-time-trend.py "${args[@]}" | tee -a compile-time.txt
      - name: Save the compile-time history
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('compile-time-history.jsonl') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: compile-time-history.jsonl
          key: compile-time-history-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compile-time
          path: |
            compile-time.txt
            compile-time-history.jsonl
          if-no-files-found: ignore
