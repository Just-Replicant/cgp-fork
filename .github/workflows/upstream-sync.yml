name: Upstream sync check

# Weekly: fetch contextgeneric/cgp anonymously and compare it with
# UPSTREAM_COMMIT and UPSTREAM_REVIEWED. When upstream has commits that are
# neither merged nor reviewed, open one issue (or comment on the open one)
# with the list. Nothing is merged or pushed; a maintainer runs
# `bash scripts/upstream-sync.sh --merge` locally, or records the commit in
# UPSTREAM_REVIEWED.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  check:
    name: Upstream commits to review
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Just-Replicant' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare with upstream
        id: sync
        run: |
          set +e
          bash scripts/upstream-sync.sh --check > report.txt 2>&1
          rc=$?
          set -e
          cat report.txt
          if [ "$rc" -eq 1 ]; then
            echo "unreviewed=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
      - name: Open or update the tracking issue
        if: ${{ steps.sync.outputs.unreviewed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Upstream contextgeneric/cgp has commits to review"
        run: |
          {
            echo "\`bash scripts/upstream-sync.sh\` found upstream commits that are neither merged"
            echo "(\`UPSTREAM_COMMIT\`) nor recorded as reviewed (\`UPSTREAM_REVIEWED\`):"
            echo
            echo '```'
            grep -v '^From \| \* ' report.txt
            echo '```'
            echo
            echo "Merge them with \`bash scripts/upstream-sync.sh --merge\`, or add each skipped"
            echo "commit to \`UPSTREAM_REVIEWED\` with a reason. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > body.md
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
