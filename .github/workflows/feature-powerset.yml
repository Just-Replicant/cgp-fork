name: Feature powerset

# Kept out of Tests on purpose. release-plz publishes when the Tests workflow
# finishes green, and this check is the slow one. It still runs on pull
# requests and on main; mark `Feature powerset (cargo-hack)` required there.
# The weekly run matters because this repo does not commit Cargo.lock, so a
# new compatible crates.io release can break a feature combination with no
# commit here.

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  CARGO_HACK_VERSION: "0.6.45"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  features:
    name: Feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup target add thumbv7m-none-eabi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-hack
          key: cargo-hack-${{ runner.os }}-${{ env.CARGO_HACK_VERSION }}
      - name: Install cargo-hack
        run: command -v cargo-hack || cargo install --locked "cargo-hack@${CARGO_HACK_VERSION}"
      - name: Every feature combination (host)
        run: cargo hack check -p cgp-fork --feature-powerset --no-dev-deps
      - name: Every feature combination (no_std; eyre needs std)
        run: cargo hack check -p cgp-fork --feature-powerset --no-dev-deps --exclude-features eyre,tokio,smol,log-tracing --target thumbv7m-none-eabi
