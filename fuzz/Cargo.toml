# Coverage-guided fuzzing of the macro parsers with cargo-fuzz (libFuzzer).
#
# A proc-macro crate cannot be linked into a libFuzzer binary, so this crate
# compiles the macro implementation modules of `cgp-fork-macro` directly (see
# `src/lib.rs`). It is not a workspace member and is never published.
#
#   cargo +nightly fuzz run entrypoints            # from the repository root
#   cargo +nightly fuzz run entrypoints -- -max_total_time=60
#
# See fuzz/README.md.
[package]
name    = "cgp-fork-macro-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The same syn features as cgp-fork-macro's normal build.
syn         = { version = "3", features = ["full", "visit", "visit-mut"] }
quote       = "1"
proc-macro2 = "1"

[lib]
# The included modules derive `Debug` under `cfg(test)`, which needs syn's
# `extra-traits`; this crate has no unit tests of its own, so skip that build.
test    = false
doctest = false

[[bin]]
name  = "entrypoints"
path  = "fuzz_targets/entrypoints.rs"
test  = false
doc   = false
bench = false

# Keep this crate out of the repository workspace: it needs nightly and
# libFuzzer, which the workspace's stable CI must not build.
[workspace]
