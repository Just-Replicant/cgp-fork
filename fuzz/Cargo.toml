# Coverage-guided fuzzing of the macro parsers with cargo-fuzz (libFuzzer).
#
# A proc-macro crate cannot be linked into a libFuzzer binary, so this crate
# depends on `cgp-fork-macro-impl`, the ordinary library behind the
# `cgp-fork-macro` shim. It is not a workspace member and is never published.
#
#   cargo +nightly fuzz run entrypoints            # every macro, from the repository root
#   cargo +nightly fuzz run cgp_component          # one macro (one target per entrypoint)
#   cargo +nightly fuzz list
#
# See fuzz/README.md.
[package]
name    = "cgp-fork-macro-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cgp-fork-macro-impl = { path = "../crates/macros/cgp-fork-macro-impl" }
proc-macro2         = "1"

[lib]
# No unit tests of its own: the entrypoint list is tested in the impl crate.
test    = false
doctest = false

[[bin]]
name  = "entrypoints"
path  = "fuzz_targets/entrypoints.rs"
test  = false
doc   = false
bench = false

# One target per macro entrypoint. Regenerate with
# `cargo run --manifest-path fuzz/Cargo.toml --example write_targets`.
# BEGIN generated targets (examples/write_targets.rs)

