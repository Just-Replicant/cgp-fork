[package]
name         = "cgp-fork-renamed-dep"
version      = "0.0.0"
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }
description  = "Checks that the cgp-fork macros work when the dependency is renamed. Never published."
publish      = false

[lints]
workspace = true

[lib]
# Only the integration tests matter.
test    = false
doctest = false
bench   = false

[dependencies]
# Renamed on purpose: generated code must name the facade `::cgp`, not `::cgp_fork`
# (docs/adr/0003-crate-path-resolution.md). Do not add `cgp-fork` under its own name.
cgp = { package = "cgp-fork", path = "../../main/cgp-fork", version = "0.10.1", features = ["std-error"] }

[dev-dependencies]
futures = { version = "0.3" }
