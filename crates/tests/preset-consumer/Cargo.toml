[package]
name         = "cgp-fork-preset-consumer"
version      = "0.0.0"
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }
description  = "Checks that a preset uses the caller's name for cgp-fork. Never published."
publish      = false

[lints]
workspace = true

[lib]
test    = false
doctest = false
bench   = false

[dependencies]
# The default crate name, on purpose: `cgp-fork-renamed-dep` imports the same package as `cgp`.
cgp-fork             = { path = "../../main/cgp-fork", version = "0.10.1" }
cgp-fork-renamed-dep = { path = "../renamed-dep" }
