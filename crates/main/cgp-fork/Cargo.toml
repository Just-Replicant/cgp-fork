[package]
name         = "cgp-fork"
version      = { workspace = true }
readme       = "./README.md"
edition      = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
rust-version = { workspace = true }
homepage     = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "A language extension for Rust, with pluggable trait implementations at compile-time."
# The test suite and examples stay in the repository; the published crate is the library.
exclude      = ["tests/", "examples/", "benches/"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `default`/`full` enable `alloc` and `compat-0.10`. Without `alloc` the crate needs only `core`.
default = ["full"]
full = ["alloc", "compat-0.10"]
# The 0.10 handler family (`extra::handler`, `extra::dispatch`, `extra::monad`), the macros
# `#[cgp_computer]` and `#[cgp_producer]`, and the `compat` bridges to the unified `handler`
# module. `#[cgp_auto_dispatch]` emits the unified family without this feature. `no_std`, no
# dependencies.
"compat-0.10" = []
# Links the `alloc` crate and enables the `String`-building error providers
# (`DebugError`, `DisplayError`).
alloc = []
# The error backends. `anyhow` and `std-error` are `no_std` + `alloc`; `eyre` requires `std`.
anyhow = ["alloc", "dep:anyhow"]
eyre = ["alloc", "dep:eyre"]
std-error = ["alloc"]
# Runtime adapters. Both need `std` and are not part of `full`, so a `no_std` build stays free
# of them. `tokio` is the current-thread and multi-thread runtimes plus the time driver
# (sleep, timeout). `smol` is an `async-executor` the context owns, with `async-io` timers;
# it does not link the `smol` meta-crate.
tokio = ["dep:tokio"]
smol = ["dep:async-executor", "dep:async-io"]
# Hidden JSON consts on every `delegate_components!` and `cgp_preset!` expansion, for
# `cargo xtask wiring` and other tools. Off by default; the consts are not emitted
# into the caller's crate unless this feature is on.
inspect = []
# `#[cgp_component(Name, mock)]` providers. Needs `alloc` for the return queue.
mock = ["alloc"]
# `TracingLogger` and `TracingDebugLogger` for `CanLog`. `tracing` is built without
# its default features, so the provider does not pull `std`.
"log-tracing" = ["dep:tracing"]
# `DefmtLogger` for `CanLog` on embedded targets. `defmt` is `no_std`.
# Host builds enable `defmt`'s `unstable-test` feature; see the target table below.
"log-defmt" = ["dep:defmt"]

[dependencies]
cgp-fork-macro = { workspace = true }
anyhow = { version = "1", default-features = false, optional = true }
# `auto-install` installs eyre's default report handler on first use. Without it, building any
# `eyre::Report` panics unless the application has called `eyre::set_hook` first.
#
# `track-caller` records where a report was built. `CanRaiseError::raise_error` is
# `#[track_caller]`, and so is every impl of it, which is what lets that location be the caller's
# line rather than a line in this crate.
eyre = { version = "0.6", default-features = false, features = ["auto-install", "track-caller"], optional = true }
# `rt-multi-thread` includes `rt` (the scheduler and `spawn`) and adds the worker-thread
# runtime. `time` is `sleep` and `timeout`. The net, io, and process drivers stay off.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time"], optional = true }
# The pieces `SmolRuntime` actually uses. `async-executor` runs spawned tasks. `async-io` is
# the timer reactor and `block_on`. The `smol` meta-crate's net, filesystem, and process
# crates are not dependencies.
async-executor = { version = "1", optional = true }
async-io = { version = "2", default-features = false, optional = true }
tracing = { version = "0.1", default-features = false, optional = true }
defmt = { version = "0.3", optional = true }

# Host tests and examples link `defmt` without a device logger or its GNU linker
# script. `unstable-test` stubs those symbols. Firmware (`target_os = "none"`)
# keeps the real logger.
[target.'cfg(not(target_os = "none"))'.dependencies]
defmt = { version = "0.3", optional = true, features = ["unstable-test"] }

[dev-dependencies]
cgp-fork-macro = { workspace = true, features = ["snapshot"] }
# Tests that enable `log-tracing` install a subscriber. The library dependency
# stays `default-features = false`; this copy turns `std` on for those tests.
tracing = { version = "0.1", features = ["std"] }
insta = { version = "1" }
futures = { version = "0.3" }
trybuild = { version = "1" }
syn = { version = "3", features = ["full", "extra-traits"] }
quote = { version = "1" }
proc-macro2 = { version = "1" }

[[example]]
name              = "error_backends"
required-features = ["anyhow", "std-error"]

[[example]]
name              = "runtime"
required-features = ["tokio"]

[[example]]
name              = "mock"
required-features = ["mock"]

[[example]]
name              = "tracing"
required-features = ["log-tracing"]

[[example]]
name              = "defmt"
required-features = ["log-defmt"]
