[package]
name         = "cgp-fork-macro"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
rust-version = { workspace = true }
homepage     = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "CGP procedural macros for defining and wiring components."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[features]
snapshot = ["dep:prettyplease"]

[dependencies]
syn         = { version = "3", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote       = { version = "1" }
proc-macro2 = { version = "1" }
itertools   = { version = "0.14" }
prettyplease = { version = "0.3", optional = true }

[dev-dependencies]
insta = { version = "1" }
prettyplease = { version = "0.3" }
